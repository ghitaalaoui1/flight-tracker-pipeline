services:
  mongo:
    image: mongo:7
    container_name: flight-mongo
    restart: unless-stopped
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db

  kafka:
    image: apache/kafka:3.8.0
    container_name: flight-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  producer:
    build:
      context: .
      dockerfile: docker/collector.Dockerfile
    container_name: flight-producer
    command: ["python", "-m", "src.messaging.producer"]
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: kafka:19092

  consumer:
    build:
      context: .
      dockerfile: docker/collector.Dockerfile
    container_name: flight-consumer
    command: ["python", "-m", "src.messaging.consumer"]
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_started
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: kafka:19092
      MONGO_URI: mongodb://mongo:27017

  spark:
    build:
      context: .
      dockerfile: docker/spark.Dockerfile
    container_name: flight-spark
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: kafka:19092

volumes:
  mongo_data: