services:
  mongo:
    image: mongo:7
    container_name: flight-mongo
    restart: unless-stopped
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db

  kafka:
    image: apache/kafka:3.8.0
    container_name: flight-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  producer:
    build:
      context: .
      dockerfile: docker/collector.Dockerfile
    container_name: flight-producer
    command: ["python", "-m", "src.messaging.producer"]
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: kafka:19092

  consumer:
    build:
      context: .
      dockerfile: docker/collector.Dockerfile
    container_name: flight-consumer
    command: ["python", "-m", "src.messaging.consumer"]
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_started
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: kafka:19092
      MONGO_URI: mongodb://mongo:27017

  spark:
    build:
      context: .
      dockerfile: docker/spark.Dockerfile
    container_name: flight-spark
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: kafka:19092
  dashboard:
    build:
      context: .
      dockerfile: docker/dashboard.Dockerfile
    container_name: flight-dashboard
    restart: unless-stopped
    ports:
      - "8501:8501"
    depends_on:
      - mongo
    environment:
      MONGO_URI: mongodb://mongo:27017
  postgres:
    image: postgres:16
    container_name: flight-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 10s
      retries: 5

  airflow:
    image: apache/airflow:2.10.3-python3.12
    container_name: flight-airflow
    hostname: airflow
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
      AIRFLOW__WEBSERVER__WORKERS: "1"
      AIRFLOW__WEBSERVER__WEB_SERVER_WORKER_TIMEOUT: "300"
      AIRFLOW__WEBSERVER__WEB_SERVER_MASTER_TIMEOUT: "600"
      MONGO_URI: mongodb://mongo:27017
      _PIP_ADDITIONAL_REQUIREMENTS: pymongo pandas pyarrow
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./data/parquet:/opt/airflow/data/parquet
      - ./logs:/opt/airflow/logs
    command: >
      bash -c "airflow db migrate && (airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com || true) && airflow standalone"

volumes:
  mongo_data:
  pg_data: